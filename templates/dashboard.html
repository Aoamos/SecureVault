<!doctype html>
<html>
  <head>
    <title>SecureVault Dashboard</title>
    <style>
      body {
        font-family: Arial;
        background: #0f172a;
        color: white;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        max-width: 500px;
        width: 100%;
      }
      h2 {
        text-align: center;
        color: #38bdf8;
      }
      .card {
        background: #1e293b;
        border-radius: 16px;
        padding: 25px;
        margin: 20px 0;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .balance {
        font-size: 24px;
        font-weight: bold;
        margin: 10px 0;
      }
      .naira {
        color: #4ade80;
      }
      .usdt {
        color: #60a5fa;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        margin: 6px 0;
        border-radius: 8px;
        border: none;
        font-size: 14px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #38bdf8;
        color: #0f172a;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 4px;
      }
      button:hover {
        background: #0ea5e9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <a
        href="/"
        style="
          display: block;
          text-align: center;
          margin-top: 20px;
          color: #94a3b8;
          text-decoration: none;
          font-size: 14px;
          border: 1px solid #334155;
          padding: 10px;
          border-radius: 8px;
        "
        >← Go Back to Landing Page</a
      >
      <h2>Welcome to SecureVault</h2>
      <div class="card">
        <h3>Wallet Balance</h3>
        <div class="balance naira">
          Naira: ₦{{ naira if naira is defined else '50,000' }}
        </div>
        <div class="balance usdt">
          USDT: ${{ usdt if usdt is defined else '1,200' }}
        </div>
        <hr style="border-color: #334155; margin: 20px 0" />
        <form method="POST" action="/send">
          <input
            type="number"
            name="amount"
            placeholder="Amount to send"
            required
          />
          <input
            type="text"
            name="code"
            placeholder="Enter 2FA Code: 123456"
            required
          />
          <button type="submit">Send Securely 🔒</button>
        </form>
      </div>
    </div>
  </body>
</html>
